name: Generate Artifacts

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  library:
    name: 📦 Build & Install (${{ matrix.config.architecture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { architecture: x86_64-linux-gnu,          gcc_toolchain: x86_64-gcc,              vendor: ""    }
          - { architecture: x86_64-windows-gnu,        gcc_toolchain: x86_64-w64-mingw32-gcc,   vendor: ""    }
          - { architecture: aarch64-linux-gnu,         gcc_toolchain: aarch64-none-linux-gnu,   vendor: ""    }
          - { architecture: aarch32-linux-gnu,         gcc_toolchain: arm-none-linux-gnueabihf, vendor: ""    }
          - { architecture: thumbv6m-none-eabi,        gcc_toolchain: arm-none-eabi,            vendor: "arm" }
          - { architecture: thumbv7em-none-eabi,       gcc_toolchain: arm-none-eabi,            vendor: "arm" }
          - { architecture: thumbv7em-none-eabihf,     gcc_toolchain: arm-none-eabi,            vendor: "arm" }
          - { architecture: thumbv7m-none-eabi,        gcc_toolchain: arm-none-eabi,            vendor: "arm" }
          - { architecture: thumbv8m.base-none-eabi,   gcc_toolchain: arm-none-eabi,            vendor: "arm" }
          - { architecture: thumbv8m.main-none-eabihf, gcc_toolchain: arm-none-eabi,            vendor: "arm" }
    env:
      preset: gcc-${{ matrix.config.architecture }}
    steps:
      - name: 🛠️ Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3

      - name: 🔧 Setup GCC toolchain (${{ matrix.config.gcc_toolchain }})
        uses: jmacheta/setup-gcc-toolchain@6c712f09af5efb677bc53e4dea195c60b66286e4 # v2.0.1
        with:
          toolchain: ${{ matrix.config.gcc_toolchain }}
          vendor: ${{ matrix.config.vendor }}
          version: latest

      - name: 📥 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 📋 Download multiarch CMake presets
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: embetech-official/cmake-presets
          tag: v0.0.1
          fileName: CMakeUserPresets.json

      - name: 🏗️ Build and install library
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ env.preset }}
          configurePresetAdditionalArgs: '["-DLOGGER_TESTS=0", "-DLOGGER_DOC=0", "-DLOGGER_EXAMPLES=0"]'
          buildPreset: ${{ env.preset }}-install

      - name: ⬆️ Upload library install directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liblogger-${{ matrix.config.architecture }}
          path: install/${{ env.preset }}/**
          if-no-files-found: error

  documentation:
    name: 📚 Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 📚 Install Doxygen
        uses: ssciwr/doxygen-install@329d88f5a303066a5bd006db7516b1925b86350e # v2.0.1

      - name: 🔧 Setup GCC toolchain
        uses: jmacheta/setup-gcc-toolchain@6c712f09af5efb677bc53e4dea195c60b66286e4 # v2.0.1
        with:
          toolchain: x86_64-gcc
          version: latest

      - name: 📚 Generate documentation
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: native-gcc
          configurePresetAdditionalArgs: '["-DLOGGER_TESTS=0", "-DLOGGER_DOC=1"]'
          buildPreset: native-gcc-all-release

      - name: ⬆️ Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liblogger-docs
          path: install/native-gcc/doc/**
          if-no-files-found: error
