enabled: true
readonly: true
language: en
caseSensitive: false

useGitignore: false # ensures better compatibility when used in multiple projects

enabledFileTypes:
 - cpp
 - c
 - markdown
 - cmake
 - json
 - yaml
 - python

dictionaries:
 - lorem-ipsum # test payloads use lorem ipsum filler text

files: /**
ignorePaths:
 - .clangd
 - .clang-format
 - .cmake-format
 - .cspell.yaml
 - doc/CMakeLists.txt
 - build/**
 - install/**
 - cmake/CPM.cmake
 - LICENSE.txt
 - LICENSES/**
 - REUSE.toml
 - '**/Doxyfile'
 - '**/third_party/**'
 - '**/.cpm-cache/**'

ignoreRegExpList:
 - /-W(no)*[a-z]+/g # ignore compiler warning flags
 - /-D[A-Z]+/g # ignore compiler define flags

